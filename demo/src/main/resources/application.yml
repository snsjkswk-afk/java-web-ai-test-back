    url: jdbc:mysql://localhost:3306/empp
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

#server:
#  servlet:
#    context-path: /api

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug



aliyun:
    oss:
        endpoint: oss-cn-beijing.aliyuncs.com
        bucketName: java-web-snsjkswk
        region: cn-beijing
        # 密钥不再硬编码，从环境变量读取，避免泄露到公开仓库
        # 优先读 ALIYUN_OSS_ACCESS_KEY_ID，未配置时回退到 OSS_ACCESS_KEY_ID（本机已存在的变量名）
        accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:${OSS_ACCESS_KEY_ID:}}
        accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:${OSS_ACCESS_KEY_SECRET:}}
